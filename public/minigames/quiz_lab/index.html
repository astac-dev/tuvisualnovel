<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Quiz de Laboratorio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      color: #60a5fa;
      margin-top: 0;
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 3rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    button {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    button:hover {
      background: #3b82f6;
    }
    .score-display {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Trivia Científica</h1>
    <div id="quiz-area">
      <div class="question" id="question-text">Cargando pregunta...</div>
      <div class="options" id="options-container"></div>
    </div>
    <div class="score-display">Pregunta <span id="current-q">1</span>/3 | Puntaje: <span id="score-val">0</span></div>
  </div>

  <script>
    const questions = [
      { q: "¿Cuál es el símbolo químico del Oro?", options: ["Au", "Ag", "O", "Or"], correct: 0 },
      { q: "¿Qué gas respiran las plantas para realizar fotosíntesis?", options: ["Oxígeno", "Dióxido de Carbono", "Nitrógeno", "Helio"], correct: 1 },
      { q: "¿Cuál es la partícula subatómica con carga negativa?", options: ["Protón", "Neutrón", "Electrón", "Fotón"], correct: 2 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const currentQDisplay = document.getElementById('current-q');
    const scoreDisplay = document.getElementById('score-val');
    const quizArea = document.getElementById('quiz-area');

    function loadQuestion() {
      const current = questions[currentQuestionIndex];
      questionText.textContent = current.q;
      optionsContainer.innerHTML = '';
      currentQDisplay.textContent = currentQuestionIndex + 1;
      
      current.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(index, current.correct);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIndex, correctIndex) {
      if (selectedIndex === correctIndex) {
        score += 10;
        scoreDisplay.textContent = score;
      }

      currentQuestionIndex++;
      
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      quizArea.innerHTML = `<h2>¡Completado!</h2><p>Puntaje final: ${score}</p><p>Devolviendo control a la Novela Visual...</p>`;
      
      // IPC POST MESSAGE AL NOVELCRAFT ENGINE
      setTimeout(() => {
        window.parent.postMessage({
          type: 'MINIGAME_COMPLETE',
          payload: {
            scoreGained: score,
            success: score >= 20,
            unlockedItems: score === 30 ? ['medalla_oro'] : []
          }
        }, '*');
      }, 1500);
    }

    // Escuchar parámetros de inicialización del motor
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'MINIGAME_INIT') {
        console.log("Trivia iniciada con dificultad:", event.data.payload.difficulty);
        loadQuestion();
      }
    });

    // Fallback por si se carga directamente
    setTimeout(() => {
      if(currentQuestionIndex === 0 && questionText.textContent === 'Cargando pregunta...') loadQuestion();
    }, 1000);

  </script>
</body>
</html>
